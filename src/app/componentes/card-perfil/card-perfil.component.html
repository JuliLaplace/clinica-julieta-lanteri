<div class="card" *ngIf="sesion.usuarioBD">
    <img [src]= "sesion.usuarioBD.imagenPerfil1" class="card-img-top" alt="imagen usuario">
    <div class="card-body">
      <h5 class="card-title">{{sesion.usuarioBD.nombre}} {{sesion.usuarioBD.apellido}}</h5>
      <div class="icono-datos">
          <fa-icon [icon]="iconoPerfil" style="color: #704cb6;" size="xl"></fa-icon>
          <p class="card-text">DNI: {{sesion.usuarioBD.dni}}</p>
      </div>
      <div class="icono-datos">
          <fa-icon [icon]="iconoEdad" style="color: #704cb6;" size="xl"></fa-icon>
          <p class="card-text">Edad: {{sesion.usuarioBD.edad}}</p>
      </div>
      <div class="icono-datos">
          <fa-icon [icon]="iconoDni" style="color: #704cb6;" size="xl"></fa-icon>
          <p class="card-text">Email: {{sesion.usuarioBD.mail}}</p>
      </div>
      
      
    </div>
</div>
