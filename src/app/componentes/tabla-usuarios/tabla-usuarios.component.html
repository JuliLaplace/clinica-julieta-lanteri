<mat-table [dataSource]="dataUsuarios.coleccionUsuarios" class="mat-elevation-z8">

  <ng-container matColumnDef="nombre">
    <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.nombre}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="apellido">
    <mat-header-cell *matHeaderCellDef> Apellido </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.apellido}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="edad">
    <mat-header-cell *matHeaderCellDef> Edad </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.edad}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="dni">
    <mat-header-cell *matHeaderCellDef> DNI </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.dni}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="obraSocial">
    <mat-header-cell *matHeaderCellDef> Obra Social </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.obraSocial}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="especialidad">
    <mat-header-cell *matHeaderCellDef> Especialidad </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{element.especialidad}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="habilitado">
    <mat-header-cell *matHeaderCellDef> Habilitado </mat-header-cell>
    <mat-cell *matCellDef="let element"> 
      <button *ngIf="element.habilitado" (click)="deshabilitarEspecialista(element)" class="btn">Deshabilitar</button>
      <button *ngIf="element.habilitado === false" (click)="habilitarEspecialista(element)" class="btn">Habilitar</button>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="imagenPerfil1">
    <mat-header-cell *matHeaderCellDef> Imagen </mat-header-cell>
    <mat-cell *matCellDef="let element" style="width: 200px;">
      <img [src]="element.imagenPerfil1" alt="">
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="imagenPerfil2">
    <mat-header-cell *matHeaderCellDef> Segunda imagen </mat-header-cell>
    <mat-cell *matCellDef="let element">
      <img [src]="element.imagenPerfil2" alt="">
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>

<mat-paginator [pageSizeOptions]="[5, 10, 20]"
showFirstLastButtons
aria-label="Select page of periodic elements">
</mat-paginator>
